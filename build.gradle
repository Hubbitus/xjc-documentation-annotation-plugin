plugins {
	id 'java-library'
	id 'groovy' // Testing
	// http://central.sonatype.org/pages/gradle.html
	id 'maven-publish'
	id 'idea'
	id 'signing'
}

group 'info.hubbitus'
version '1.1'

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
	options.encoding = 'UTF-8'
}

repositories {
	mavenCentral()
}

dependencies {
	api 'com.sun.xml.bind:jaxb-core:2.3.0.1'
	api "javax.xml.bind:jaxb-api:${versionJaxbIpi}"
	testImplementation "javax.xml.bind:jaxb-api:${versionJaxbIpi}"
	implementation "com.sun.xml.bind:jaxb-xjc:${versionJaxb}"
	implementation "com.sun.xml.bind:jaxb-impl:${versionJaxb}"

	// Logging
	implementation "org.slf4j:slf4j-api:${versionSlf4j}"
	implementation "ch.qos.logback:logback-classic:${versionLogback}"

	testImplementation "org.codehaus.groovy:groovy:${versionGroovy}"
	testImplementation "org.spockframework:spock-core:${versionSpock}"
}

///////////////////////////////////////////////////////////////
// Artifacts publishing into central OSS repository
// http://central.sonatype.org/pages/gradle.html
def ossrhUserName = project.findProperty('ossrhUsername') ?: '' // To do not fail on CI when them does not defined
def ossrhPassword = project.findProperty('ossrhPassword') ?: ''

java {
	withJavadocJar()
	withSourcesJar()
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java

			pom {
				name = project.name
				packaging = 'jar'
				description = 'XJC plugin to bring XSD descriptions into annotations of generated classes'
				url = 'https://github.com/Hubbitus/xjc-documentation-annotation-plugin'

				scm {
					connection = 'scm:git:https://github.com/Hubbitus/xjc-documentation-annotation-plugin.git'
					developerConnection = 'scm:git:git@github.com:Hubbitus/xjc-documentation-annotation-plugin.git'
					url = 'https://github.com/Hubbitus/xjc-documentation-annotation-plugin'
				}

				licenses {
					license {
						name = 'MIT'
						url = 'https://opensource.org/licenses/MIT'
					}
				}

				developers {
					developer {
						id = 'Hubbitus'
						name = 'Pavel Alexeev'
						email = 'Pahan@Hubbitus.info'
					}
				}
			}
		}
	}

	repositories {
		maven {
			name = 'ossrh'
			def releasesRepoUrl = uri('https://oss.sonatype.org/service/local/staging/deploy/maven2/')
			def snapshotsRepoUrl = uri('https://oss.sonatype.org/content/repositories/snapshots/')
			url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
			credentials {
				username = ossrhUserName
				password = ossrhPassword
			}
		}
	}
}

signing {
	required { gradle.taskGraph.hasTask('publish') } // Do not require signing on CI/local builds
	sign publishing.publications.mavenJava
}

// /Artifacts publishing into central OSS repository
////////////////////////////////////////////////////
