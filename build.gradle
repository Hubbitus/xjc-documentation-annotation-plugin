plugins {
	id 'java-library'
	id 'groovy' // Testing
	// http://central.sonatype.org/pages/gradle.html
	id 'maven-publish'
	id 'idea'
	id 'signing'
	id 'com.gradleup.nmcp' version '1.6.2' // Publishing into Maven Central via Central Portal API
}

group = 'info.hubbitus'
version = '1.2-SNAPSHOT' // 1.1 is released and has the NPE bug (#2), the fix is in the next version

// Gradle itself requires JDK 17+, but the built plugin must work on Java 11+
java {
	// Also used for Groovy (tests) bytecode level, which otherwise defaults to the JVM running Gradle
	sourceCompatibility = JavaVersion.VERSION_11
	targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 11
}

tasks.withType(Test).configureEach {
	useJUnitPlatform() // Spock 2
}

// Run tests on a specific JVM (to check that built plugin works on it): ./gradlew test -PtestJavaVersion=11
if (project.hasProperty('testJavaVersion')) {
	tasks.withType(Test).configureEach {
		javaLauncher = javaToolchains.launcherFor {
			languageVersion = JavaLanguageVersion.of(project.property('testJavaVersion') as int)
		}
	}
}

tasks.withType(Javadoc).configureEach {
	options.encoding = 'UTF-8'
}

repositories {
	mavenCentral()
}

dependencies {
	api 'com.sun.xml.bind:jaxb-core:2.3.0.1'
	api "javax.xml.bind:jaxb-api:${versionJaxbIpi}"
	testImplementation "javax.xml.bind:jaxb-api:${versionJaxbIpi}"
	implementation "com.sun.xml.bind:jaxb-xjc:${versionJaxb}"
	implementation "com.sun.xml.bind:jaxb-impl:${versionJaxb}"

	// Logging
	implementation "org.slf4j:slf4j-api:${versionSlf4j}"
	implementation "ch.qos.logback:logback-classic:${versionLogback}"

	testImplementation "org.apache.groovy:groovy:${versionGroovy}"
	testImplementation "org.spockframework:spock-core:${versionSpock}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher" // Required by Gradle 9 for JUnit Platform (version is managed by Spock BOM)
}

///////////////////////////////////////////////////////////////
// Artifacts publishing into Maven Central (Sonatype Central Portal), see README "Release" section
// https://central.sonatype.org/publish/publish-portal-gradle/

java {
	withJavadocJar()
	withSourcesJar()
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java

			pom {
				name = project.name
				packaging = 'jar'
				description = 'XJC plugin to bring XSD descriptions into annotations of generated classes'
				url = 'https://github.com/Hubbitus/xjc-documentation-annotation-plugin'

				scm {
					connection = 'scm:git:https://github.com/Hubbitus/xjc-documentation-annotation-plugin.git'
					developerConnection = 'scm:git:git@github.com:Hubbitus/xjc-documentation-annotation-plugin.git'
					url = 'https://github.com/Hubbitus/xjc-documentation-annotation-plugin'
				}

				licenses {
					license {
						name = 'MIT'
						url = 'https://opensource.org/licenses/MIT'
					}
				}

				developers {
					developer {
						id = 'Hubbitus'
						name = 'Pavel Alexeev'
						email = 'Pahan@Hubbitus.info'
					}
				}
			}
		}
	}
}

// Credentials are NOT required for regular builds, only when publishing:
//   -PcentralPortalUsername / -PcentralPortalPassword (or ORG_GRADLE_PROJECT_centralPortalUsername/Password env variables) - Central Portal user token
//   -PsigningKey / -PsigningPassword (or ORG_GRADLE_PROJECT_signingKey/signingPassword) - ASCII-armored PGP private key (in-memory) and its passphrase
nmcp {
	publishAllPublicationsToCentralPortal {
		username = providers.gradleProperty('centralPortalUsername')
		password = providers.gradleProperty('centralPortalPassword')
		// USER_MANAGED: deployment is validated and uploaded, then must be published manually in the Portal UI.
		// Use AUTOMATIC (-PcentralPortalPublishingType=AUTOMATIC) to release without confirmation.
		publishingType = providers.gradleProperty('centralPortalPublishingType').orElse('USER_MANAGED')
	}
}

signing {
	// Do not require signing on CI/local builds, only when publishing into Central Portal
	required = { gradle.taskGraph.allTasks.any { it.name.startsWith('nmcpPublishAllPublicationsToCentralPortal') } }
	def signingKey = providers.gradleProperty('signingKey').orNull
	if (signingKey) {
		useInMemoryPgpKeys(signingKey, providers.gradleProperty('signingPassword').orNull)
	}
	sign publishing.publications.mavenJava
}

// /Artifacts publishing into Maven Central
////////////////////////////////////////////////////
